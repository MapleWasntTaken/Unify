spring.application.name=financialapp
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/finappdb}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

plaid.client-id=${PLAID_CLIENT_ID}
plaid.secret=${PLAID_SECRET}
plaid.environment=${PLAID_ENV}
plaid.webhook-url=${PLAID_WEBHOOK_URL}
plaid.client-name=FinancialApp

app.security.remember-me-key=${REMEMBER_ME_KEY}

server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework

logging.level.com.financialapp.financialapp=INFO
